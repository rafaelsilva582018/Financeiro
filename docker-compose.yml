services:
  app:
    build: ./docker/php
    container_name: financeiro_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    restart: always

  web:
    image: nginx:alpine
    container_name: financeiro_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: always

  db:
    image: mariadb:10.11
    container_name: financeiro_db
    environment:
      MARIADB_DATABASE: financeiro
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: financeiro
      MARIADB_PASSWORD: financeiro
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    restart: always

  node:
    image: node:20-alpine
    container_name: financeiro_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run build"
    restart: "no"

volumes:
  dbdata:
